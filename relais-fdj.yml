name: Relais FDJ

# Télécharge les archives officielles FDJ et les publie à côté de index.html.
# Horaires en UTC : chaque heure de 21 h 37 à 0 h 37 (heure de Paris en hiver),
# puis à 6 h 37 et 12 h 37. Lancement manuel possible depuis l'onglet « Actions ».
on:
  schedule:
    - cron: '37 20-23 * * *'
    - cron: '37 5,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relais-fdj
  cancel-in-progress: false

jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et vérifier les archives FDJ
        id: fetch
        continue-on-error: true
        run: python3 fetch_fdj.py

      - name: Publier les archives et le manifeste
        run: |
          git config user.name "relais-fdj"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -q -m "Relais FDJ $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Signaler un échec de récupération
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Au moins une archive FDJ n'a pas pu être récupérée. Détail dans data/manifest.json."
          exit 1
